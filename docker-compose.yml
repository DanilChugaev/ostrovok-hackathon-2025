services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - yarn-cache:/root/.yarn

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - yarn-cache:/root/.yarn
    profiles:
      - dev

volumes:
  yarn-cache:
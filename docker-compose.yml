services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    volumes:
      - yarn-cache:/root/.yarn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  app-dev:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - yarn-cache:/root/.yarn
    profiles:
      - dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  yarn-cache: